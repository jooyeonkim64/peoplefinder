:root {
  --blue: #2447D5;          /* 포인트 글자·아이콘 */
  --blue-fill: #2447D5;     /* 주요 버튼, 일치 키워드 배경 */
  --blue-soft: #E8F0FE;
  --orange: #C2410C;
  --orange-soft: #FFF1E0;
  --gray-soft: #F3F4F6;
  --line: #E5E7EB;
  --text: #111827;
  --sub: #6B7280;
  --bg: #FFFFFF;
  --page: #F7F8FA;
  --ink: #111827;           /* 선택된 필터 칩 */
  --on-ink: #FFFFFF;
  --shadow: 0 1px 2px rgba(17,24,39,.04), 0 6px 16px rgba(17,24,39,.05);
  --radius: 12px;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue: #8FA5FF; --blue-fill: #3D5CE8; --blue-soft: #1D2650;
    --orange: #FDBA74; --orange-soft: #3A2513;
    --gray-soft: #252A34; --line: #2F3542;
    --text: #F3F4F6; --sub: #A1A8B5; --bg: #161A21; --page: #0E1116;
    --ink: #F3F4F6; --on-ink: #111827;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --blue: #8FA5FF; --blue-fill: #3D5CE8; --blue-soft: #1D2650;
  --orange: #FDBA74; --orange-soft: #3A2513;
  --gray-soft: #252A34; --line: #2F3542;
  --text: #F3F4F6; --sub: #A1A8B5; --bg: #161A21; --page: #0E1116;
  --ink: #F3F4F6; --on-ink: #111827;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; height: 100%;
  background: var(--page); color: var(--text);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all; overflow-wrap: anywhere;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
p { margin: 0; }
h1, h2, h3 { margin: 0; }

/* ---------- 앱 틀: 모바일 세로 기준, PC에서는 가운데 같은 폭 ---------- */
.app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  background: var(--bg);
  display: flex; flex-direction: column;
  border-left: 1px solid var(--line); border-right: 1px solid var(--line);
}
@media (max-width: 481px) { .app { border: 0; } }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: grid; grid-template-columns: 72px 1fr 72px; align-items: center;
  height: 52px; padding: 0 12px;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.topbar h1 { text-align: center; font-size: 16px; font-weight: 700; }
.topbar h1.brand { color: var(--blue); font-size: 17px; letter-spacing: -0.01em; }
.back {
  justify-self: start; display: inline-flex; align-items: center; gap: 2px;
  border: 0; background: none; color: var(--sub); font-size: 15px; padding: 6px 4px;
}
.back svg { width: 18px; height: 18px; }

main#view { flex: 1; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 20px; }

.tabbar {
  position: sticky; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--bg); border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
}
.tab {
  position: relative; border: 0; background: none;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11px; color: var(--sub); padding: 4px 0;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--blue); font-weight: 700; }
.tab .dot { position: absolute; top: 3px; left: calc(50% + 8px); width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }

/* ---------- 글자 ---------- */
.title-lg { font-size: 23px; font-weight: 700; line-height: 1.35; letter-spacing: -0.02em; }
.title-md { font-size: 18px; font-weight: 700; line-height: 1.4; letter-spacing: -0.01em; }
.lead { color: var(--sub); font-size: 14px; margin-top: 6px; }
.label { font-size: 13px; font-weight: 600; color: var(--sub); }
.hint { font-size: 12.5px; color: var(--sub); }
.err { font-size: 12.5px; color: var(--orange); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* ---------- 검색창 ---------- */
.search {
  display: flex; align-items: center; gap: 8px;
  border: 1.5px solid var(--line); border-radius: 999px;
  padding: 4px 4px 4px 16px; background: var(--bg);
}
.search:focus-within { border-color: var(--blue); }
.search > svg { width: 18px; height: 18px; color: var(--sub); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 8px 0; font-size: 15px; }
.search input::placeholder { color: var(--sub); }
.search .go {
  border: 0; border-radius: 999px; background: var(--blue-fill); color: #fff;
  font-weight: 700; font-size: 14px; padding: 8px 16px; flex: none;
}

/* ---------- 칩 ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 8px; border: 1px solid transparent;
  background: var(--gray-soft); color: var(--text);
  font-size: 13px; line-height: 1.4; white-space: nowrap;
}
button.chip { cursor: pointer; }
.chip.on { background: var(--blue-fill); color: #fff; font-weight: 600; }
.chip.line { background: var(--bg); border-color: var(--line); }
.chip.line.on { background: var(--blue-fill); border-color: var(--blue-fill); color: #fff; }
.chip .n { color: var(--sub); font-size: 12px; font-variant-numeric: tabular-nums; }
.chip.on .n { color: rgba(255,255,255,.8); }
.chip.add { border-style: dashed; border-color: var(--line); background: var(--bg); color: var(--sub); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters::-webkit-scrollbar { display: none; }
.filter {
  flex: none; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg);
  font-size: 13px; white-space: nowrap;
}
.filter[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); font-weight: 600; }

/* ---------- 문어 ---------- */
.octo { display: inline-block; flex: none; line-height: 0; }
.octo svg { width: 100%; height: 100%; display: block; }
.state {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px 3px 3px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
}
.state .octo { width: 20px; height: 20px; }
.s1 { background: var(--blue-soft); color: var(--blue); }
.s2 { background: var(--orange-soft); color: var(--orange); }
.s3 { background: var(--gray-soft); color: var(--sub); }

.status-box {
  display: flex; align-items: center; gap: 12px;
  border-radius: 14px; padding: 12px 14px; width: 100%; text-align: left; border: 0;
}
.status-box .octo { width: 48px; height: 48px; }
.status-box b { display: block; font-size: 15px; }
.status-box .label { color: inherit; opacity: .75; font-weight: 500; font-size: 12px; }
.status-box .chev { margin-left: auto; width: 18px; height: 18px; opacity: .6; flex: none; }
.bounce .octo { animation: bob .5s ease-out; }
@keyframes bob { 0% { transform: translateY(0) rotate(0); } 35% { transform: translateY(-5px) rotate(-6deg); } 70% { transform: translateY(1px) rotate(3deg); } 100% { transform: none; } }

/* ---------- 카드 ---------- */
.card {
  background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.who { display: flex; align-items: center; gap: 10px; }

/* 프로필 등록 화면의 기본 선택지 (화면별버튼.md 2. 키워드 예시) */
const PICK_WORK = [['업무', ['Excel', 'PPT', 'Python']], ['언어', ['영어', '일본어']], ['직무', ['제조업', '금융업']]];
const PICK_INTEREST = ['러닝', '축구', '야구', '여행', '독서', '맛집'];
const CATS = ['업무', '언어', '직무', '취미'];

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
const deptLabel = k => (DEPTS.find(d => d.key === k) || { label: k ? k + ' 본부' : '' }).label;
// 키워드 카테고리: 기본 사전(KW) → 사용자가 등록한 키워드(서버) → 지금 입력 중인 키워드 → 기본값
const kwCat = (tag, fallback) => (KW[tag] ? KW[tag][0] : (S.keywords[tag] || (ui.ob && ui.ob.cats && ui.ob.cats[tag]) || fallback));
const LANG_WORDS = ['한국어', '중국어', '스페인어', '독일어', '프랑스어', '베트남어', '러시아어', '아랍어', '태국어', '이탈리아어', '포르투갈어', '인도네시아어', '광둥어'];
const INDUSTRY_WORDS = ['반도체', '자동차', '에너지', '부동산', '물류', '건설', '통신', '화학', '철강', '조선', '항공', '엔터테인먼트', '공공', '게임산업', '이커머스', '플랫폼'];
// 새 업무 키워드 자동 분류: '~어'는 언어, '~업'·산업명은 직무, 나머지는 업무
function guessCat(tag) {
  const t = tag.replace(/\s+/g, '');
  if (LANG_WORDS.includes(t) || (/어$/.test(t) && t.length <= 6)) return '언어';
  if (INDUSTRY_WORDS.includes(t) || /(업|산업)$/.test(t)) return '직무';
  return '업무';
}
const kwExp = (tag, seed) => { const e = KW[tag]; return e ? e[1][seed % e[1].length] : ''; };
const shownScore = m => Math.min(MANNER_DISPLAY_MAX, Math.round(m));   // 저장은 소수점, 표시만 반올림
const DAY = 86400000;
function ago(ts) {
  const d = Date.now() - ts;
  if (d < 60000) return '방금';
  if (d < 3600000) return Math.floor(d / 60000) + '분 전';
  if (d < DAY) return Math.floor(d / 3600000) + '시간 전';
  return Math.floor(d / DAY) + '일 전';
}
function tier(m) {
  const s = shownScore(m);
  if (s >= 85) return { text: '모두가 찾는 동료', spark: true };
  if (s >= 70) return { text: '믿고 물어볼 수 있는 동료', spark: false };
  return { text: '이제 시작한 동료', spark: false };
}

/* =====================================================================
   저장소 연결
   ===================================================================== */
const B = { mode: null, token: null };   // mode: 'server' | 'local'
const LOCAL_KEY = 'peoplefinder-local-db-v1';
let localDb = null;

function localHash(s) {   // 브라우저 보여주기 모드 전용 (데이터가 이 브라우저 밖으로 나가지 않음)
  let h = 2166136261;
  for (let r = 0; r < 3; r++) for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i) + r; h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16);
}
function randomToken() {
  const a = new Uint8Array(24);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => { a[i] = Math.random() * 256; });
  return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
}
const localCtx = () => ({
  now: Date.now(), newToken: randomToken, hashToken: t => 'h' + t,
  hashPassword: pw => 'local$' + localHash(pw), verifyPassword: (pw, h) => h === 'local$' + localHash(pw)
});
function localSave() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(localDb)); } catch (e) { /* 저장 실패해도 화면은 동작 */ } }

const ready = (async () => {
  try {
    const r = await fetch('api/health', { cache: 'no-store' });
    const j = await r.json();
    if (r.ok && j.ok) { B.mode = 'server'; return; }
  } catch (e) { /* 서버 없음 → 브라우저 모드 */ }
  B.mode = 'local';
  try { localDb = JSON.parse(localStorage.getItem(LOCAL_KEY)); } catch (e) { localDb = null; }
  if (!localDb || !Array.isArray(localDb.users)) localDb = PFCore.emptyDb();
  try {
    const sample = await (await fetch('data/sample-data.json', { cache: 'no-store' })).json();
    PFCore.syncSamples(localDb, sample, Date.now());
  } catch (e) {
    B.loadError = '샘플 데이터를 불러오지 못했어요. 터미널에서 npm start로 실행한 주소(http://localhost:3000)에서 열어주세요.';
  }
  localSave();
})();

async function api(action, payload = {}) {
  await ready;
  if (B.mode === 'local') {
    try {
      const out = PFCore.handle(localDb, Object.assign({}, payload, { action, token: B.token }), localCtx());
      if (out.changed) localSave();
      return JSON.parse(JSON.stringify(out.data));
    } catch (e) {
      if (e.status === 401 && action !== 'login') authLost();
      throw e;
    }
  }
  let res;
  try {
    res = await fetch('api', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, B.token ? { Authorization: 'Bearer ' + B.token } : {}),
      body: JSON.stringify(Object.assign({}, payload, { action }))
    });
  } catch (e) {
    throw Object.assign(new Error('서버에 연결하지 못했어요. 서버가 켜져 있는지 확인해주세요.'), { code: 'NETWORK' });
  }
  let data = {};
  try { data = await res.json(); } catch (e) { /* 빈 응답 */ }
  if (!res.ok) {
    if (res.status === 401 && action !== 'login') authLost();
    throw Object.assign(new Error(data.error || '요청을 처리하지 못했어요.'), { status: res.status, code: data.code });
  }
  return data;
}

/* ---------- 화면 데이터 ---------- */
const S = { me: null, people: [], keywords: {}, connections: [], thread: null };
function mapUser(u) {
  const fill = (list, base) => (list || []).map((k, i) => ({ tag: k.tag, exp: k.exp || (u.sampleId != null ? kwExp(k.tag, base + i) : '') }));
  return {
    id: u.id, isSample: u.sampleId != null, name: u.name, dept: u.dept, intro: u.intro || '',
    work: fill(u.work, u.id), interest: fill(u.interest, u.id), status: u.status,
    manner: u.manner, count: u.feedbackCount, praise: u.praise || [0, 0, 0, 0], recent: u.recent || [],
    isMe: !!(S.me && u.id === S.me.id)
  };
}
function applyState(st) {
  if (!st) return;
  if (st.me) S.me = st.me;
  if (st.people) S.people = st.people.map(mapUser);
  if (st.keywords) S.keywords = st.keywords;
  if (st.connections) S.connections = st.connections;
}
const byId = id => S.people.find(p => String(p.id) === String(id));
const others = () => S.people.filter(p => !p.isMe);
const meProfile = () => S.people.find(p => p.isMe) || (S.me ? mapUser(S.me) : null);
const displayName = p => (p.isMe || !MASK_NAMES) ? p.name : p.name.charAt(0) + 'OO';
const unknownUser = { id: 0, name: '알 수 없음', dept: '', status: 2, intro: '', work: [], interest: [] };

/* ---------- 검색 ---------- */
function searchPeople(q) {
  const nq = norm(q);
  const catQ = CATS.find(c => norm(c) === nq);   // '언어'처럼 카테고리 이름으로 검색
  const hit = (k, fb) => catQ ? kwCat(k.tag, fb) === catQ : (norm(k.tag).includes(nq) || (nq.length >= 2 && norm(k.exp).includes(nq)));
  const rows = S.people.map(p => {
    if (!nq) return { p, rank: 9, work: [], interest: [] };
    const work = p.work.filter(k => hit(k, '업무')).map(k => k.tag);
    const interest = p.interest.filter(k => hit(k, '취미')).map(k => k.tag);
    const exact = p.work.some(k => norm(k.tag) === nq) || p.interest.some(k => norm(k.tag) === nq);
    const rank = !work.length && !interest.length ? -1 : (exact ? 0 : 1) + (work.length ? 0 : 2);
    return { p, rank, work, interest };
  }).filter(r => r.rank >= 0);
  rows.sort((a, b) => a.rank - b.rank || a.p.status - b.p.status || b.p.manner - a.p.manner);
  return rows;
}
function keywordCounts(field) {
  const c = {};
  S.people.forEach(p => p[field].forEach(k => { c[k.tag] = (c[k.tag] || 0) + 1; }));
  return Object.entries(c).sort((a, b) => b[1] - a[1]);
}
// 앱에 등록된 전체 키워드 (카테고리, 등록 인원) — 매번 새로 계산해서 새 키워드가 바로 보임
function registry() {
  const m = new Map();
  const add = (tag, cat) => { if (!m.has(tag)) m.set(tag, { tag, cat, count: 0, isNew: !KW[tag] }); return m.get(tag); };
  S.people.forEach(p => {
    p.work.forEach(k => { add(k.tag, kwCat(k.tag, '업무')).count++; });
    p.interest.forEach(k => { add(k.tag, kwCat(k.tag, '취미')).count++; });
  });
  return [...m.values()].sort((a, b) => b.count - a.count || a.tag.localeCompare(b.tag, 'ko'));
}
function suggHtml(q) {
  const nq = norm(q);
  if (!nq) return '';
  const list = registry().filter(r => norm(r.tag).includes(nq) || norm(r.cat) === nq)
    .sort((a, b) => (norm(b.tag).startsWith(nq) - norm(a.tag).startsWith(nq)) || b.count - a.count).slice(0, 8);
  if (!list.length) return '';
  return `<div class="sugg-box"><span class="hint">등록된 키워드</span><div class="row">${list.map(r =>
    `<button class="chip line" data-act="searchKw" data-kw="${esc(r.tag)}">${esc(r.tag)} <span class="n">${r.cat} ${r.count}명</span>${r.isNew ? '<i class="new-dot" title="새로 등록된 키워드"></i>' : ''}</button>`).join('')}</div></div>`;
}
function catBrowseHtml() {
  const reg = registry();
  return `<details class="cat-browse" ${ui.catOpen ? 'open' : ''} data-toggle="catOpen">
    <summary>카테고리로 찾기</summary>
    <div class="stack" style="margin-top:12px">${CATS.map(c => {
      const list = reg.filter(r => r.cat === c);
      return list.length ? `<div class="kw-row"><span class="hint">${c}</span><div class="row">${list.map(r =>
        `<button class="chip line" data-act="searchKw" data-kw="${esc(r.tag)}">${esc(r.tag)} <span class="n">${r.count}</span>${r.isNew ? '<i class="new-dot" title="새로 등록된 키워드"></i>' : ''}</button>`).join('')}</div></div>` : '';
    }).join('')}</div>
  </details>`;
}

/* ---------- 조각 UI ---------- */
const octo = (i, size) => `<span class="octo" style="width:${size}px;height:${size}px" aria-hidden="true"><svg><use href="#${STATUS[i].icon}"/></svg></span>`;
const stateChip = i => `<span class="state ${STATUS[i].cls}"><span class="octo"><svg aria-hidden="true"><use href="#${STATUS[i].icon}"/></svg></span>${STATUS[i].msg}</span>`;
const avatar = (p, cls = '') => `<div class="avatar ${cls}" aria-hidden="true">${esc((p.name || '?').charAt(0))}</div>`;

function personCard(r) {
  const p = r.p;
  const hits = new Set([...r.work, ...r.interest]);
  const chips = p.work.map(k => `<span class="chip ${hits.has(k.tag) ? 'on' : ''}">${esc(k.tag)}</span>`).join('')
    + r.interest.map(t => `<span class="chip on">${esc(t)}</span>`).join('');
  return `<article class="card">
    <div class="who">${avatar(p)}<div class="meta"><div class="name">${esc(displayName(p))}${p.isMe ? ' <span class="me-tag">나</span>' : ''}</div><div class="org">${esc(deptLabel(p.dept))}</div></div>${stateChip(p.status)}</div>
    <div class="row">${chips}</div>
    ${p.intro ? `<p class="intro">${esc(p.intro)}</p>` : ''}
    <div class="card-foot"><button class="btn sub small" data-act="openProfile" data-id="${p.isMe ? 'me' : p.id}">프로필 보기</button></div>
  </article>`;
}

function mannerBlock(p) {
  const t = tier(p.manner);
  const s = shownScore(p.manner);
  const praise = PRAISE.map((txt, i) => `<div><span>${txt}</span><span class="cnt ${p.praise[i] ? '' : 'zero'}">${p.praise[i]}회</span></div>`).join('');
  const recent = p.recent.slice(0, 2).map(r => `<div class="review"><span>“${PRAISE[r.item]}”</span><span class="when">${ago(r.ts)}</span></div>`).join('');
  return `<section class="card manner" aria-label="매너지수">
    <div class="between"><span class="label">매너지수</span><span class="hint">받은 피드백 ${p.count}건</span></div>
    <div class="bar-row">
      <div class="bar" role="meter" aria-valuemin="0" aria-valuemax="99" aria-valuenow="${s}" aria-label="매너지수 ${s}"><i style="width:${s}%"></i></div>
      <span class="score">${s}${t.spark ? '<svg aria-hidden="true"><use href="#i-spark"/></svg>' : ''}</span>
    </div>
    <div class="between"><span class="tier">${t.text}</span></div>
    <p class="hint">도움을 받은 동료들의 피드백으로 쌓이는 점수예요.</p>
    <div class="stack-sm" style="margin-top:4px">
      <span class="label">도움 받은 동료들의 피드백</span>
      ${p.count ? `<div class="praise">${praise}</div>${recent ? `<div class="stack-sm" style="margin-top:6px">${recent}</div>` : ''}` : `<p class="hint">아직 받은 피드백이 없어요.</p>`}
    </div>
  </section>`;
}

function keywordSection(p, field, title, sel) {
  const list = p[field];
  if (!list.length) return '';
  const active = list.find(k => k.tag === sel) || null;
  const chips = list.map(k => `<button class="chip ${field === 'interest' ? 'line' : ''} ${active && active.tag === k.tag ? 'on' : ''}" data-act="pickExp" data-tag="${esc(k.tag)}" aria-pressed="${!!(active && active.tag === k.tag)}">${esc(k.tag)}</button>`).join('');
  const box = active ? `<div class="exp-box"><span class="cat">${esc(kwCat(active.tag, field === 'work' ? '업무' : '취미'))}</span><b>${esc(active.tag)}</b><span>${esc(active.exp || '한 줄 경험이 아직 없어요.')}</span></div>` : '';
  return `<section class="stack">
    <div class="section-title"><span class="label">${title}</span><span class="hint">눌러서 경험 보기</span></div>
    <div class="row">${chips}</div>${box}
  </section>`;
}
function modeNote() {
  if (B.mode === 'server') return '가입 정보와 메시지는 서버의 저장소 파일(storage/db.json)에 저장되어 모두와 공유돼요.';
  if (B.mode === 'local') return '서버 없이 열린 화면이라 가입 정보와 메시지가 이 브라우저에만 저장돼요.';
  return '';
}

  /* 메시지 목록: 내가 보낸 질문 + 내가 받은 질문 */
  messages: {
    title: '메시지',
    html() {
      if (!S.connections.length) return `<div class="empty" style="padding-top:60px">${octo(0, 72)}<b>아직 주고받은 메시지가 없어요.</b><p>필요한 동료를 찾아 질문을 보내보세요.</p>

      const meId = S.me.id;
      return `<div>${S.connections.map(c => {
        const asker = c.askerId === meId;
        const p = byId(asker ? c.recipientId : c.askerId) || unknownUser;
        const pill = asker
          ? (!c.replied ? '<span class="pill wait">답변 대기</span>'
            : c.unread ? '<span class="pill new">새 답변</span>'
            : c.feedback ? '<span class="pill done">피드백 완료</span>' : '<span class="pill fb">피드백 남기기</span>')

        const last = c.last ? (c.last.senderId === meId ? '나: ' : '') + c.last.body : '';
        return `<button class="msg-row" data-act="openThread" data-cid="${c.id}">${avatar(p)}
          <div class="meta"><div class="between"><b>${esc(displayName(p))} <span class="hint" style="font-weight:400">${esc(c.topic || '')}</span></b><span class="hint">${ago(c.updatedAt)}</span></div>
          <div class="between"><span class="preview">${esc(last)}</span>${pill}</div></div></button>`;
      }).join('')}</div>`;
    }
  },

  /* 대화 + 답장 + 피드백 */
  thread: {
    title: '메시지', nav: false,
    html(cur) {
      const t = S.thread;
      if (!t || t.id !== cur.cid) return `<div class="empty">${octo(1, 72)}<b>대화를 불러오는 중이에요.</b></div>`;
      const meId = S.me.id;
      const asker = t.askerId === meId;
      const p = byId(asker ? t.recipientId : t.askerId) || unknownUser;
      const bubbles = t.messages.map(m => {
        const mine = m.senderId === meId;
        return `<div class="bubble ${mine ? 'me' : 'them'}">${esc(m.body)}</div><span class="bubble-meta ${mine ? 'me' : ''}">${ago(m.createdAt)}</span>`;
      }).join('');
      let fb = '';
      if (asker && t.replied && !t.feedback) {
        fb = `<section class="feedback stack">
          <div><h3 class="title-md" style="font-size:16px">도움을 받았다면 피드백을 남겨주세요.</h3>
          <p class="hint">남긴 피드백은 매너지수에 반영돼요.</p></div>
          <div class="row">${PRAISE.map((x, i) => `<button class="chip line ${ui.fbSel.includes(i) ? 'on' : ''}" aria-pressed="${ui.fbSel.includes(i)}" data-act="fbToggle" data-i="${i}">${x}</button>`).join('')}</div>
          ${ui.fbErr ? `<span class="err">${ui.fbErr}</span>` : ''}
          <button class="btn" data-act="fbSubmit" data-cid="${t.id}">피드백 남기기</button>
        </section>`;
      } else if (t.feedback) {
        fb = `<section class="feedback stack">
          <span class="label">${asker ? '남긴 피드백' : '받은 피드백'}</span>
          <div class="row">${t.feedback.items.map(i => `<span class="chip on">${PRAISE[i]}</span>`).join('')}</div>
          <p class="hint">${asker ? esc(displayName(p)) + '님의' : '내'} 매너지수가 ${shownScore(t.feedback.before)}에서 ${shownScore(t.feedback.after)}(으)로 올랐어요.${asker ? ' 이 연결에는 피드백을 한 번만 남길 수 있어요.' : ''}</p>
        </section>`;
      } else if (!asker) {
        fb = `<p class="hint" style="text-align:center">답장을 받은 동료가 도움이 됐다면 피드백을 남길 수 있어요.</p>`;

      const waiting = asker && !t.replied
        ? `${p.isSample ? '<div class="waiting" aria-label="답변을 기다리는 중"><i></i><i></i><i></i></div>' : ''}<span class="bubble-meta">질문을 보냈어요. 상대방의 답변을 기다려주세요.</span>`
        : '';

      <div class="who">${avatar(p)}<div class="meta"><div class="name">${esc(displayName(p))}</div><div class="org">${esc(deptLabel(p.dept))}${asker ? '' : ' · 나에게 온 질문'}</div></div>${stateChip(p.status)}</div>

      <form class="composer" data-submit="reply">
        <textarea class="textarea" id="reply" rows="2" maxlength="1000" placeholder="${asker ? '추가로 보낼 내용을 입력해주세요.' : '답장을 입력해주세요.'}" data-bind="reply" aria-label="메시지 입력">${esc(ui.reply)}</textarea>

  /* 내 프로필 */
  me: {
    title: '내 프로필',
    html() {
      const p = meProfile();
      if (!p) return '';
      const sel = ui.expSel && ui.expSel.id === 'me' ? ui.expSel.tag : (p.work[0] && p.work[0].tag);
      return `
      <section class="pf-head">${avatar(p, 'lg')}<div><div class="name">${esc(p.name)}</div><div class="org">${esc(deptLabel(p.dept))}</div></div></section>
      ${p.intro ? `<p class="quote">${esc(p.intro)}</p>` : ''}
      <button class="status-box ${STATUS[p.status].cls} ${ui.bounce ? 'bounce' : ''}" data-act="openStatus">${octo(p.status, 48)}
        <div><span class="label">현재 연락 상태</span><b>${STATUS[p.status].name} · ${STATUS[p.status].msg}</b></div>
        <svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></button>
      ${keywordSection(p, 'work', '잘하거나 경험해본 분야', sel)}
      ${keywordSection(p, 'interest', '관심사 / 취미', sel)}
      ${mannerBlock(p)}
      <div class="actions">
        <button class="btn sub" data-act="editProfile">프로필 수정</button>
        <button class="textlink" style="align-self:center" data-act="logout">로그아웃</button>
      </div>
      <p class="hint mode-note">${modeNote()}</p>`;
    },
    after() { ui.bounce = false; }
  }
};

/* ---------- 이동 · 그리기 ---------- */
const TABS = ['home', 'search', 'messages', 'me'];
function go(name, params = {}) { stack.push(Object.assign({ name }, params)); render(true); }
function replace(name, params = {}) { stack.pop(); go(name, params); }
function back() { if (stack.length > 1) { stack.pop(); ui.reply = ''; render(true); } }
function setTab(name) { stack = [{ name }]; ui.expSel = null; render(true); refreshPeople(); }
// 탭을 옮길 때 최신 프로필·매너지수를 바로 다시 불러옴
async function refreshPeople() {
  if (!B.token) return;
  try {
    const before = JSON.stringify([S.people, S.me]);
    applyState(await api('people'));
    lastPeople = Date.now();
    if (JSON.stringify([S.people, S.me]) !== before && !busy && TABS.includes(curScreen().name)) render(false);
  } catch (e) { /* 다음 확인 때 다시 시도 */ }
}

function render(scrollTop) {
  const cur = curScreen();
  const def = SCREENS[cur.name];
  // 다시 그려도 입력 중이던 칸의 커서가 유지되도록
  const ae = document.activeElement;
  const keepId = !scrollTop && ae && ae.id && $('#view').contains(ae) ? ae.id : null;
  let sel = null;
  if (keepId) { try { sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { sel = null; } }

  $('#topbar').hidden = def.header === false;
  $('#tabbar').hidden = def.nav === false;
  const t = $('#topTitle');
  t.textContent = def.title; t.className = def.brand ? 'brand' : '';
  $('#topLeft').innerHTML = stack.length > 1 ? `<button class="back" data-act="back"><svg aria-hidden="true"><use href="#i-back"/></svg>뒤로</button>` : '';
  const root = TABS.includes(stack[0].name) ? stack[0].name : null;
  document.querySelectorAll('.tab').forEach(b => {
    if (b.dataset.tab === root) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#msgDot').hidden = !S.connections.some(c => c.unread > 0);
  $('#view').innerHTML = def.html(cur);
  if (def.after) def.after(cur);
  if (scrollTop) window.scrollTo(0, 0);
  if (keepId) {
    const el = document.getElementById(keepId);
    if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange && sel[0] != null) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* 선택 불가 입력칸 */ } } }
  }
}
function scrollToEnd() { const c = $('.composer'); if (c) c.scrollIntoView({ block: 'center' }); }

/* ---------- 시트 · 토스트 ---------- */
let toastTimer;
function toast(msg, sub) {
  clearTimeout(toastTimer);
  $('#toastHost').innerHTML = `<div class="toast" role="status">${esc(msg)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  toastTimer = setTimeout(() => { $('#toastHost').innerHTML = ''; }, 2800);
}
function openStatusSheet() {
  const cur = meProfile().status;
  $('#overlay').innerHTML = `<div class="scrim" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="연락 가능 상태" data-stop>
    <div class="grip"></div>
    <h3 class="title-md">연락 가능 상태</h3>
    <p class="hint" style="margin-top:-6px">현재 연락 가능한 상태를 선택해주세요.</p>
    ${STATUS.map((s, i) => `<button class="opt" role="radio" aria-checked="${cur === i}" data-act="setStatus" data-i="${i}">${octo(i, 44)}<div><b>${s.name}</b><span>${s.msg}</span></div></button>`).join('')}
  </div></div>`;
  const first = $('#overlay .opt[aria-checked="true"]'); if (first) first.focus();
}
function closeSheet() { $('#overlay').innerHTML = ''; }

/* ---------- 요청 실행 (중복 클릭 방지 + 오류 안내) ---------- */
let busy = false;
async function run(fn) {
  if (busy) return;
  busy = true; document.body.classList.add('busy');
  try { await fn(); }
  catch (e) { if (e.code !== 'LOGIN_REQUIRED') toast(e.message || '문제가 생겼어요. 다시 시도해주세요.'); }
  finally { busy = false; document.body.classList.remove('busy'); }
}
function resetSession() {
  B.token = null;
  Object.assign(S, { me: null, people: [], keywords: {}, connections: [], thread: null });
  Object.assign(ui, { q: '', filter: 'all', expSel: null, ob: null, draft: '', reply: '', fbSel: [], fbErr: '' });
  ui.authForm.password = '';
}
function authLost() {
  if (!B.token) return;
  resetSession(); closeSheet();
  ui.authMode = 'login'; ui.authErr = {};
  stack = [{ name: 'auth' }]; render(true);
  toast('다시 로그인해주세요.');
}
function afterAuth() {
  if (!S.me.profileDone) { startOnboard(false); stack = [{ name: 'onboard' }]; render(true); }
  else setTab('home');
}

/* ---------- 새 메시지 확인 (주기적으로) ---------- */
const unreadTotal = list => list.reduce((n, c) => n + (c.unread || 0), 0);
function updateConnections(list, quiet) {
  const before = unreadTotal(S.connections);
  const changed = JSON.stringify(list) !== JSON.stringify(S.connections);
  S.connections = list;
  $('#msgDot').hidden = !list.some(c => c.unread > 0);
  if (!quiet && unreadTotal(list) > before) toast('새 메시지가 왔어요.', '메시지에서 확인할 수 있어요.');
  return changed;
}
let lastPeople = 0;
async function poll() {
  if (!B.token || busy || document.hidden) return;
  const cur = curScreen();
  try {
    if (cur.name === 'thread') {
      const d = await api('thread', { id: cur.cid });
      if (curScreen() !== cur) return;
      const grew = !S.thread || d.thread.messages.length !== S.thread.messages.length;
      const changed = JSON.stringify(d.thread) !== JSON.stringify(S.thread);
      S.thread = d.thread;
      updateConnections(d.connections, true);
      if (changed) { render(false); if (grew) scrollToEnd(); }
    } else {
      const d = await api('connections');
      if (updateConnections(d.connections) && curScreen() === cur && ['messages', 'home'].includes(cur.name)) render(false);
    }
    if (Date.now() - lastPeople > 15000 && ['home', 'search', 'profile', 'me'].includes(curScreen().name)) {
      lastPeople = Date.now();
      const before = JSON.stringify(S.people);
      applyState(await api('people'));
      if (JSON.stringify(S.people) !== before && !busy) render(false);
    }
  } catch (e) { /* 다음 주기에 다시 시도 */ }
}
setInterval(poll, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

/* ---------- 동작 ---------- */
function startOnboard(editing) {
  const src = editing && S.me
    ? { intro: S.me.intro || '', work: JSON.parse(JSON.stringify(S.me.work || [])), interest: JSON.parse(JSON.stringify(S.me.interest || [])), status: S.me.status }
    : { intro: '', work: [], interest: [], status: 0 };
  ui.ob = Object.assign(src, { step: 1, editing, err: '', cats: {}, note: null });
}

const ACT = {
  back,
  tab: el => setTab(el.dataset.tab),
  authMode: el => { ui.authMode = el.dataset.mode; ui.authErr = {}; render(false); },

  obToggle: el => {
    const list = ui.ob[el.dataset.field], t = el.dataset.tag;
    const i = list.findIndex(k => k.tag === t);
    if (i >= 0) list.splice(i, 1); else list.push({ tag: t, exp: '' });
    ui.ob.err = ''; render(false);
  },
  obAdd: el => {
    const field = el.dataset.field, input = $('#add-' + field);
    let t = (input.value || '').trim().replace(/\s+/g, ' ');
    if (!t) { input.focus(); return; }
    // 이미 앱에 있는 키워드면 그 이름·카테고리를 그대로 씀 (대소문자·띄어쓰기 무시)
    const known = registry().find(r => norm(r.tag) === norm(t))
      || [...Object.keys(KW).map(k => ({ tag: k, cat: KW[k][0] })), ...Object.keys(S.keywords).map(k => ({ tag: k, cat: S.keywords[k] }))].find(r => norm(r.tag) === norm(t));
    let cat;
    if (known) { t = known.tag; cat = known.cat; }
    else {
      const picked = field === 'work' ? ($('#addcat-work').value || '') : '';
      cat = field === 'work' ? (picked || guessCat(t)) : '취미';
      ui.ob.cats[t] = cat;
    }
    if (!ui.ob[field].some(k => k.tag === t)) ui.ob[field].push({ tag: t, exp: '' });
    ui.ob.note = { field, text: known ? `‘${t}’ 키워드는 이미 ${cat} 카테고리에 있어서 선택해뒀어요.` : `‘${t}’ 키워드를 ${cat} 카테고리에 새로 추가했어요.` };
    ui.ob.err = ''; render(false); const n = $('#add-' + field); if (n) n.focus();
  },
  obNext: () => {
    if (!ui.ob.work.length) { ui.ob.err = '키워드를 1개 이상 골라주세요'; render(false); return; }
    ui.ob.step = 2; render(true);
  },
  obPrev: () => { ui.ob.step = 1; render(true); },
  obStatus: el => { ui.ob.status = +el.dataset.i; render(false); },
  obSave: () => run(async () => {
    const o = ui.ob;
    const d = await api('saveProfile', {
      intro: o.intro, status: o.status, newKeywords: o.cats,
      work: o.work.map(k => ({ tag: k.tag, exp: k.exp || '' })),
      interest: o.interest.map(k => ({ tag: k.tag, exp: k.exp || '' }))
    });
    applyState(d.state);
    const editing = o.editing; ui.ob = null;
    if (editing) { setTab('me'); toast('프로필을 저장했어요.'); }
    else { setTab('home'); toast('프로필이 등록됐어요! 이제 필요한 동료를 찾아보세요.'); }
  }),

  searchKw: el => { ui.q = el.dataset.kw; ui.filter = 'all'; setTab('search'); },
  seeAvailable: () => { ui.q = ''; ui.filter = 'available'; setTab('search'); },
  filter: el => { ui.filter = el.dataset.f; render(false); },
  openProfile: el => {
    ui.expSel = null;
    if (el.dataset.id === 'me' || (S.me && String(el.dataset.id) === String(S.me.id))) { setTab('me'); return; }
    go('profile', { id: +el.dataset.id });
  },
  pickExp: el => {
    const cur = curScreen();
    ui.expSel = { id: cur.name === 'me' ? 'me' : cur.id, tag: el.dataset.tag };
    render(false);
  },
  openConnect: el => {
    const p = byId(el.dataset.id);
    if (!p) return;
    const nq = norm(ui.q);
    const hit = nq && [...p.work, ...p.interest].find(k => norm(k.tag).includes(nq));
    ui.topic = hit ? hit.tag : (p.work[0] && p.work[0].tag) || null;
    ui.draft = ui.topic ? greeting(ui.topic) : ''; ui.draftErr = '';
    go('connect', { id: p.id });
  },
  topic: el => {
    const prev = ui.topic, next = el.dataset.tag;
    const ta = $('#draft');
    const cur = ta ? ta.value : ui.draft;
    const oldHead = `안녕하세요! ${prev} 관련해서`;
    // 인사 문장의 분야만 바꾸고, 사용자가 덧붙인 내용은 그대로 둠
    if (prev && cur.includes(oldHead)) ui.draft = cur.replace(oldHead, `안녕하세요! ${next} 관련해서`);
    else if (!cur.trim()) ui.draft = greeting(next);
    else ui.draft = cur;
    ui.topic = next; render(false);
  },
  quick: el => {
    const ta = $('#draft');
    ui.draft = (ta.value.trim() ? ta.value.trim() + ' ' : '') + el.dataset.text;
    ui.draftErr = ''; render(false);
    const n = $('#draft'); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
  },
  send: el => {
    const text = ($('#draft').value || '').trim();
    if (!text) { ui.draftErr = '질문 내용을 입력해주세요.'; render(false); $('#draft').focus(); return; }
    run(async () => {
      const d = await api('sendQuestion', { to: +el.dataset.id, topic: ui.topic, body: text });
      S.thread = d.thread; updateConnections(d.connections, true);
      ui.draft = ''; ui.reply = ''; ui.fbSel = []; ui.fbErr = '';
      replace('thread', { cid: d.connectionId });
      toast('질문을 보냈어요. 상대방의 답변을 기다려주세요.');
    });
  },
  teams: () => toast('시연 화면에서는 Teams로 이동하지 않아요.', '실제 서비스에서는 Teams 대화창이 열려요.'),

  openThread: el => run(async () => {
    const cid = +el.dataset.cid;
    const d = await api('thread', { id: cid });
    S.thread = d.thread; updateConnections(d.connections, true);
    ui.reply = ''; ui.fbSel = []; ui.fbErr = '';
    go('thread', { cid });
    scrollToEnd();
  }),
  fbToggle: el => {
    const i = +el.dataset.i;
    ui.fbSel = ui.fbSel.includes(i) ? ui.fbSel.filter(x => x !== i) : [...ui.fbSel, i];
    ui.fbErr = ''; render(false);
  },
  fbSubmit: el => {
    if (!ui.fbSel.length) { ui.fbErr = '칭찬 항목을 1개 이상 골라주세요'; render(false); return; }
    run(async () => {
      const d = await api('feedback', { id: +el.dataset.cid, items: ui.fbSel });
      S.thread = d.thread; applyState(d.state); ui.fbSel = [];
      render(false);
      const f = d.thread.feedback, p = byId(d.thread.recipientId) || unknownUser;
      toast('피드백을 남겼어요.', `${displayName(p)}님의 매너지수 ${shownScore(f.before)} → ${shownScore(f.after)}`);
    });
  },

  openStatus: openStatusSheet,
  closeSheet: (el, ev) => { if (ev.target.closest('[data-stop]')) return; closeSheet(); },
  setStatus: el => run(async () => {
    const d = await api('setStatus', { status: +el.dataset.i });
    applyState(d.state); closeSheet();
    ui.bounce = true; render(false);
    toast(`연락 상태를 바꿨어요. ${STATUS[S.me.status].msg}`);
  }),
  editProfile: () => { startOnboard(true); go('onboard'); },
  logout: () => run(async () => {
    try { await api('logout'); } catch (e) { /* 이미 만료돼도 로그아웃 처리 */ }
    resetSession(); ui.authMode = 'login'; ui.authErr = {};
    stack = [{ name: 'auth' }]; render(true);
  })
};

function syncAuth(form) { ['name', 'dept', 'email', 'password'].forEach(k => { if (form.elements[k]) ui.authForm[k] = form.elements[k].value; }); }
const SUBMIT = {
  login(form) {
    syncAuth(form);
    const f = ui.authForm, e = {};
    if (!f.email.trim()) e.email = '이메일을 입력해주세요.';
    if (!f.password) e.password = '비밀번호를 입력해주세요.';
    ui.authErr = e; if (Object.keys(e).length) { render(false); return; }
    run(async () => {
      try {
        const d = await api('login', { email: f.email.trim(), password: f.password });
        B.token = d.token; ui.authForm.password = ''; ui.authErr = {};
        applyState(d.state); afterAuth();
      } catch (err) { ui.authErr = { form: err.message }; render(false); }
    });
  },
  signup(form) {
    syncAuth(form);
    const f = ui.authForm, e = {};
    if (!f.name.trim()) e.name = '이름을 입력해주세요.';
    if (!f.dept) e.dept = '소속을 선택해주세요.';
    if (!f.email.trim()) e.email = '이메일을 입력해주세요.';
    else if (!/^\S+@\S+\.\S+$/.test(f.email.trim())) e.email = '이메일 형식을 확인해주세요.';
    if (!f.password) e.password = '비밀번호를 입력해주세요.';
    else if (f.password.length < 6) e.password = '비밀번호를 6자 이상 입력해주세요.';
    ui.authErr = e; if (Object.keys(e).length) { render(false); return; }
    run(async () => {
      try {
        const d = await api('signup', { name: f.name.trim(), dept: f.dept, email: f.email.trim(), password: f.password });
        B.token = d.token; ui.authForm.password = ''; ui.authErr = {};
        applyState(d.state);
        startOnboard(false); stack = [{ name: 'onboard' }]; render(true);
        toast('가입이 끝났어요. 이제 프로필을 등록해 주세요.');
      } catch (err) {
        ui.authErr = err.code === 'EMAIL_TAKEN' ? { email: err.message } : { form: err.message };
        render(false);
      }
    });
  },
  homeSearch(form) {
    const q = form.q.value.trim();
    if (!q) { form.q.focus(); return; }
    ui.q = q; ui.filter = 'all'; setTab('search');
  },
  resultSearch(form) { ui.q = form.q.value.trim(); ui.filter = 'all'; render(false); },
  reply() {
    const body = ($('#reply').value || '').trim();
    if (!body) { $('#reply').focus(); return; }
    run(async () => {
      const d = await api('sendMessage', { id: S.thread.id, body });
      S.thread = d.thread; updateConnections(d.connections, true);
      ui.reply = ''; render(false); scrollToEnd();
      const n = $('#reply'); if (n) n.focus({ preventScroll: true });
    });
  }
};

/* ---------- 이벤트 위임 ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { if (el.tagName === 'BUTTON' && el.type !== 'submit') ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('submit', ev => {
  const form = ev.target.closest('[data-submit]');
  if (!form) return;
  ev.preventDefault();
  SUBMIT[form.dataset.submit](form);
});
document.addEventListener('input', ev => {
  if (ev.target.dataset.suggest) { const box = document.getElementById(ev.target.dataset.suggest); if (box) box.innerHTML = suggHtml(ev.target.value); }
  const path = ev.target.dataset.bind;
  if (!path) return;
  const keys = path.split('.');
  let obj = ui;
  for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
  obj[keys[keys.length - 1]] = ev.target.value;
});
document.addEventListener('toggle', ev => { if (ev.target.dataset && ev.target.dataset.toggle) ui[ev.target.dataset.toggle] = ev.target.open; }, true);
document.addEventListener('change', ev => { if (ev.target.dataset.bind) ev.target.dispatchEvent(new Event('input', { bubbles: true })); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#overlay').innerHTML) closeSheet();
  if (ev.key === 'Enter' && ev.target.dataset.enter) { ev.preventDefault(); ACT[ev.target.dataset.enter](ev.target); }
  // 메시지 칸: Enter로 보내기, Shift+Enter로 줄바꿈
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing && ev.target.id === 'reply') { ev.preventDefault(); SUBMIT.reply(); }
});


/* ---------- 첫 화면 인트로: 바다에서 문어들이 떠다니다 손을 잡아요 ----------
   몸 모양은 기존 문어 3종(밝은·보통·뒤집힌)과 같고, 색과 표정만 달라요.
   화면을 누르거나 '건너뛰기'를 누르면 바로 로그인 화면으로 넘어가요. */
const INTRO_OCTOS = [
  //   몸 색      입 색       처음 표정     손잡은 뒤 표정   흩어진 위치(%)
  { c: '#F472B6', m: '#fff',    face: 'joy',       sx: 10, sy: 18 },
  { c: '#34D399', m: '#1E293B', face: 'wink',      sx: 66, sy: 12 },
  { c: '#A78BFA', m: '#fff',    face: 'grumpy',    to: 'sparkle', flip: true, sx: 42, sy: 60 },
  { c: '#FBBF24', m: '#1E293B', face: 'surprised', to: 'joy',     sx: 6,  sy: 58 },
  { c: '#22D3EE', m: '#1E293B', face: 'shy',       sx: 72, sy: 54 }
];
const INK = '#1E293B';
function introFace(kind, m) {
  const eyes = (r = 7.5) => `<circle cx="48" cy="55" r="${r}" fill="${INK}"/><circle cx="72" cy="55" r="${r}" fill="${INK}"/>`;
  const shine = '<circle cx="46" cy="53" r="3.2" fill="#fff"/><circle cx="50" cy="57" r="1.4" fill="#fff"/><circle cx="70" cy="53" r="3.2" fill="#fff"/><circle cx="74" cy="57" r="1.4" fill="#fff"/>';
  switch (kind) {
    case 'sparkle':   // 반짝 눈 + 웃는 입
      return eyes() + shine + `<path d="M 54 63 Q 60 70 66 63" stroke="${m}" stroke-width="3.5" stroke-linecap="round" fill="none"/>`;
    case 'joy':       // ^^ 눈 + 활짝 웃는 입
      return `<path d="M 42 57 Q 48 48 54 57 M 66 57 Q 72 48 78 57" stroke="${INK}" stroke-width="4" stroke-linecap="round" fill="none"/>`
        + `<path d="M 52 62 Q 60 74 68 62 Z" fill="${INK}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M 56 67.5 Q 60 64.5 64 67.5 Q 60 71 56 67.5 Z" fill="#FB7185"/>`;
    case 'wink':      // 윙크 + 메롱
      return `<path d="M 42 56 Q 48 50 54 56" stroke="${INK}" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="72" cy="55" r="7.5" fill="${INK}"/><circle cx="70" cy="53" r="3.2" fill="#fff"/>`
        + `<ellipse cx="63" cy="67" rx="3" ry="3.6" fill="#FB7185"/><path d="M 53 62 Q 60 69 67 62" stroke="${m}" stroke-width="3.5" stroke-linecap="round" fill="none"/>`;
    case 'surprised': // 동그란 눈 + 'o' 입
      return eyes(8) + `<circle cx="46" cy="52" r="3" fill="#fff"/><circle cx="70" cy="52" r="3" fill="#fff"/><ellipse cx="60" cy="66" rx="3.5" ry="4.5" fill="${INK}"/>`;
    case 'shy':       // 작은 눈 + 물결 입 (수줍음)
      return `<circle cx="50" cy="56" r="5" fill="${INK}"/><circle cx="74" cy="56" r="5" fill="${INK}"/><circle cx="49" cy="54.5" r="1.8" fill="#fff"/><circle cx="73" cy="54.5" r="1.8" fill="#fff"/>`
        + `<path d="M 54 65 q 3 -2.5 6 0 q 3 2.5 6 0" stroke="${m}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
    case 'grumpy':    // >< 눈 + 시옷 입 (뒤집힌 문어)
      return `<path d="M 41 50 L 51 57 M 41 57 L 51 50 M 69 50 L 79 57 M 69 57 L 79 50" stroke="${m}" stroke-width="3.5" stroke-linecap="round"/>`
        + `<path d="M 55 67 L 60 62 L 65 67" stroke="${m}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  }
  return '';
}
function introOcto(o, i, n) {
  const legs = `<path d="M 28 82 C 24 92 34 98 38 88 C 42 98 52 98 55 88 C 58 98 68 98 71 88 C 74 98 84 98 88 88 C 92 98 100 90 95 82" stroke="${o.c}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  const blush = o.face === 'shy' ? 0.95 : 0.7;
  const arm = (d, hx) => `<path pathLength="1" d="${d}" stroke="${o.c}" stroke-width="7" stroke-linecap="round" fill="none"/><circle class="io-hand" cx="${hx}" cy="60" r="5.5" fill="${o.c}"/>`;
  return `<div class="io ${o.flip ? 'flip' : ''} ${o.to ? 'swap' : ''}" style="--sx:${o.sx}%;--sy:${o.sy}%;--i:${i};--rx:${(i - (n - 1) / 2)}">
    <div class="io-bob"><svg viewBox="-5 0 130 120" aria-hidden="true">
      <g class="io-arms">${i > 0 ? arm('M 30 66 C 18 72 8 68 -1 60', -1) : ''}${i < n - 1 ? arm('M 90 66 C 102 72 112 68 121 60', 121) : ''}</g>
      <g class="io-body">${legs}
        <ellipse cx="60" cy="55" rx="36" ry="32" fill="${o.c}"/>
        <ellipse cx="42" cy="35" rx="7" ry="4" transform="rotate(-30 42 35)" fill="#fff" opacity=".45"/>
        <ellipse cx="38" cy="63" rx="5.5" ry="3.2" fill="#FF6B8A" opacity="${blush}"/><ellipse cx="82" cy="63" rx="5.5" ry="3.2" fill="#FF6B8A" opacity="${blush}"/>
        <g class="io-face1">${introFace(o.face, o.m)}</g>${o.to ? `<g class="io-face2">${introFace(o.to, o.m)}</g>` : ''}
      </g>
    </svg></div></div>`;
}
function playIntro() {
  const host = $('#intro');
  if (!host) return;
  const n = INTRO_OCTOS.length;
  const W = Math.round(Math.min(88, (Math.min(window.innerWidth, 480) - 20) / n));
  host.style.setProperty('--w', W + 'px');
  const rand = (a, b) => a + Math.random() * (b - a);
  const rays = [12, 38, 66].map((x, k) => `<i class="io-ray" style="left:${x}%;transform:rotate(${-14 + k * 12}deg);animation-delay:${-k * 2}s"></i>`).join('');
  const bubbles = Array.from({ length: 14 }, () => { const d = rand(6, 16); return `<i class="io-bubble" style="left:${rand(2, 96)}%;width:${d}px;height:${d}px;animation-duration:${rand(5, 10)}s;animation-delay:${-rand(0, 9)}s"></i>`; }).join('');
  const wave = fill => `<svg viewBox="0 0 800 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 Q 100 10 200 40 T 400 40 T 600 40 T 800 40 V 90 H 0 Z" fill="${fill}"/></svg>`;
  const hearts = Array.from({ length: n - 1 }, (_, i) => `<svg class="io-heart" viewBox="0 0 24 22" style="--hx:${(i + 0.5 - (n - 1) / 2) * W}px;--i:${i}" aria-hidden="true"><path d="M12 21 C 5 15 1 11 1 6.5 A 5.5 5.5 0 0 1 12 4 A 5.5 5.5 0 0 1 23 6.5 C 23 11 19 15 12 21 Z" fill="#fff"/></svg>`).join('');
  host.innerHTML = `${rays}${bubbles}
    <div class="io-sea">${wave('rgba(255,255,255,.10)')}${wave('rgba(30,58,138,.55)')}</div>
    <div role="img" aria-label="바다에서 여러 색깔의 문어들이 떠다니다 서로 손을 잡는 장면">${INTRO_OCTOS.map((o, i) => introOcto(o, i, n)).join('')}${hearts}</div>
    <div class="io-title"><b>People Finder</b><span>나에게 필요한 경험을 가진 동료를 찾아보세요.</span></div>
    <button class="io-skip" type="button">건너뛰기</button>`;
  host.querySelectorAll('.io').forEach(el => { el.style.setProperty('--rx', (parseFloat(el.style.getPropertyValue('--rx')) * W) + 'px'); });

  let done = false;
  const timers = [];
  const finish = () => {
    if (done) return;
    done = true; timers.forEach(clearTimeout);
    host.classList.add('out');
    setTimeout(() => host.remove(), 650);
    document.removeEventListener('keydown', onKey);
  };
  const onKey = e => { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') finish(); };
  host.addEventListener('click', finish);
  document.addEventListener('keydown', onKey);
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    host.classList.add('still', 'linked');               // 움직임 줄이기 설정이면 손잡은 장면만 잠깐 보여줌
    timers.push(setTimeout(finish, 1800));
    return;
  }
  timers.push(setTimeout(() => host.classList.add('linked'), 1400));
  timers.push(setTimeout(finish, 4900));
}

/* ---------- 시작: 항상 로그인/회원가입 화면부터 ---------- */
stack = [{ name: 'auth' }];
render(true);
playIntro();
ready.then(() => { if (curScreen().name === 'auth') render(false); });
</script>
</body>
</html>
